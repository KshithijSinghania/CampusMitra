{% extends "base.html" %}
{% block title %}Log In — CampusMitra{% endblock %}
{% block content %}
<div class="card">
    <h2>Welcome back</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username">
        <label>Password</label>
        <input type="password" name="password">
        <button type="submit">Log In</button>
    </form>
    <p class="muted-link">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
