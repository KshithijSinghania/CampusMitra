{% extends "base.html" %}
{% block title %}Sign Up — CampusMitra{% endblock %}
{% block content %}
<div class="card">
    <h2>Create your account</h2>
    <p class="subtitle">Gmail linking is required right after signup.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <p class="muted-link">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
