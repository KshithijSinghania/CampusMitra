<h2>Campus Navigation</h2>

<form method="post">
    {% csrf_token %}
    <label>From: <input type="text" name="start" placeholder="e.g. Hostel H10"></label>
    <label>To: <input type="text" name="end" placeholder="e.g. Library"></label>
    <button type="submit">Show Route</button>
</form>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

{% if fmap_html %}
    <div>{{ fmap_html|safe }}</div>
{% endif %}

<h3>All Known Locations</h3>
<ul>
    {% for loc in locations %}
        <li>{{ loc.name }} ({{ loc.get_category_display }})</li>
    {% endfor %}
</ul>
