{% extends "base.html" %}
{% block title %}Chat — CampusMitra{% endblock %}
{% block content %}
<div class="card">
    <h2>Chat with CampusMitra</h2>
    <div id="chat-log" style="border:1px solid var(--border); border-radius:8px; padding:16px; height:420px; overflow-y:auto; margin:14px 0; background:#fafafa;"></div>
    <form id="chat-form" style="display:flex; gap:10px;">
        <input type="text" id="message-input" placeholder="Ask something..." autocomplete="off" style="flex:1; margin:0;">
        <button type="submit" style="margin:0;">Send</button>
    </form>
</div>
<style>
    #chat-log div { margin-bottom: 12px; line-height: 1.5; }
    #chat-log strong { color: var(--primary); }
</style>
<script>
function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}
const chatLog = document.getElementById("chat-log");
const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");
function appendMessage(sender, text) {
    const div = document.createElement("div");
    div.innerHTML = `<strong>${sender}:</strong> ${text}`;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
}
form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    appendMessage("You", message);
    input.value = "";
    appendMessage("CampusMitra", "<em>thinking...</em>");
    try {
        const response = await fetch("{% url 'chat_api' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
            body: JSON.stringify({ message: message }),
        });
        const data = await response.json();
        chatLog.lastChild.remove();
        appendMessage("CampusMitra", data.error ? `Error: ${data.error}` : data.answer);
    } catch (err) {
        chatLog.lastChild.remove();
        appendMessage("CampusMitra", "Something went wrong. Please try again.");
    }
});
</script>
{% endblock %}
